  <style>
    :root {
      --red: #DF0024;
      --yellow: #F7E300;
      --ink: #111111;
      --muted: #666666;
      --rule: #e2e2e2;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #ffffff;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .stripe {
      display: flex;
      height: 14px;
      flex: 0 0 auto;
    }
    .stripe span { flex: 1; }
    .stripe .r { background: var(--red); }
    .stripe .y { background: var(--yellow); }
    .stripe .k { background: var(--ink); }

    main {
      flex: 1 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 640px;
    }

    .logo {
      width: 76px;
      height: auto;
      display: block;
      margin-bottom: 2.25rem;
    }

    .eyebrow {
      font-size: clamp(0.62rem, 2.4vw, 0.78rem);
      letter-spacing: 0.42em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.2rem, 15vw, 6.5rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }

    .accent {
      width: 56px;
      height: 9px;
      background: var(--yellow);
      margin-bottom: 0.9rem;
    }

    .subtitle {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.15rem, 4.5vw, 1.6rem);
      font-weight: 700;
      color: var(--red);
      margin-bottom: 1.6rem;
    }

    .meta {
      font-size: clamp(0.8rem, 3vw, 0.95rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      margin-bottom: 2.4rem;
    }

    .cta {
      display: inline-block;
      background: var(--ink);
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 1rem 2.25rem;
      border-radius: 4px;
      transition: background 0.15s ease;
    }
    .cta:hover, .cta:focus-visible { background: var(--red); }

    .note {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.9rem;
      line-height: 1.5;
    }

    footer {
      flex: 0 0 auto;
      border-top: 1px solid var(--rule);
      padding: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      line-height: 1.7;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    footer strong { color: var(--ink); font-weight: 600; }

    @media (max-width: 480px) {
      main { padding: 2.25rem 1.25rem; }
      .cta { display: block; text-align: center; }
    }
  </style>
</head>
<body>

  <main>
    <div class="card">

      <p class="eyebrow">Sijil Pelajaran Malaysia</p>
      <h1>Physics</h1>

      <a class="cta" href="notes.html">Open the Notes →</a>
      <p class="note">Large document (~20 MB) — best opened on Wi-Fi.</p>
    </div>
  </main>

  <footer>
